# Settings for the live site on Render (free plan). Render reads this file when you
# create the site with "New > Blueprint". Values marked "sync: false" are private:
# Render asks you to type them in, so they are never stored in the code.
services:
  - type: web
    name: nextfit
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir backend app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY          # keeps logins safe; Render makes a random one
        generateValue: true
      - key: DATABASE_URL        # the PostgreSQL address from Neon
        sync: false
      - key: ADMIN_EMAIL         # the first admin account (SRS FR1.1)
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BREVO_API_KEY       # sends the password reset emails (SRS FR1.3)
        sync: false
      - key: EMAIL_FROM          # for example noreply@karega.tech
        sync: false
