{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<h1>Reset your password</h1>
<form method="post">
  <label for="email">Your account email</label>
  <input id="email" name="email" type="email">
  <p><button>Get reset link</button></p>
</form>
{% if link %}
  <div class="card">
    <p><strong>Demo mode:</strong> email sending is not set up on this server, so the link is shown here.</p>
    <p><a href="{{ link }}">{{ link }}</a></p>
  </div>
{% endif %}
{% endblock %}
